<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>pet</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
            user-select: none;
            cursor: grab;
        }

        #stage {
            position: absolute;
            inset: 0;
        }

        #stage:active {
            cursor: grabbing;
        }

        #bubble {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%) translateY(-6px) scale(0.96);
            max-width: 250px;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ebaecb;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(201, 135, 171, 0.25);
            color: #4a2c3e;
            font-size: 12.5px;
            line-height: 19px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        #bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        #emotion {
            display: block;
            margin-top: 4px;
            text-align: right;
            color: #f06ca8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="bubble"><span id="text"></span><span id="emotion"></span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three.module.js",
                "three/addons/": "./libs/jsm/"
            }
        }
    </script>
    <script type="module" src="./pet.js"></script>
</body>
</html>
